name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-baselines.txt
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
      - name: Content check (long quotations, document binaries, notices)
        run: python scripts/check_content.py
      - name: Secrets scan (working tree and history)
        run: python scripts/scan_secrets.py
      - name: Generated files are up to date
        run: |
          PYTHONPATH=src python -m ikhtibar.build_all > /dev/null
          git diff --exit-code -- docs data README.md templates examples
